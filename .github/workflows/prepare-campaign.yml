name: Prepare and check campaign
on:
  push:
    branches:
      - campaign/interview-refinements-20260914
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: campaign/interview-refinements-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install resource and browser tools
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Prepare PDFs, worksheets and product image
        run: python scripts/build_resources.py
      - name: Check project paths, layouts, downloads and interactions
        run: python scripts/verify_site.py
      - name: Save generated assets and review evidence on the development branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/downloads assets/images
          if [ -d qa ]; then git add qa; fi
          if ! git diff --cached --quiet; then
            git commit -m "Prepare campaign resources and browser review evidence"
            git push origin HEAD:campaign/interview-refinements-20260914
          fi
